name: Build MSI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test test/BlockRdpBruteForce.Tests/BlockRdpBruteForce.Tests.csproj --verbosity normal

  build-msi:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    strategy:
      matrix:
        include:
          - variant: self-contained
            publish_flag: --self-contained
          - variant: framework-dependent
            publish_flag: --no-self-contained

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $ver = $Matches[1]
          } else {
            [xml]$csproj = Get-Content src/BlockRdpBruteForce/BlockRdpBruteForce.csproj
            $ver = $csproj.Project.PropertyGroup.Version
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish service (${{ matrix.variant }})
        run: dotnet publish src/BlockRdpBruteForce -c Release -r win-x64 ${{ matrix.publish_flag }} -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }}

      - name: Publish tray (${{ matrix.variant }})
        run: dotnet publish src/BlockRdpBruteForce.Tray -c Release -r win-x64 ${{ matrix.publish_flag }} -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }}

      - name: Publish updater (${{ matrix.variant }})
        run: dotnet publish src/BlockRdpBruteForce.Updater -c Release -r win-x64 ${{ matrix.publish_flag }} -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }}

      - name: Build MSI (${{ matrix.variant }})
        run: dotnet build installer/BlockRdpBruteForce.Installer.wixproj -c Release

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: BlockRdpBruteForce-${{ matrix.variant }}
          path: installer/bin/Release/BlockRdpBruteForce.msi

  release:
    needs: build-msi
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $env:GITHUB_REF -match '^refs/tags/v(.+)$' | Out-Null
          $ver = $Matches[1]
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Extract release notes from tag
        shell: pwsh
        run: |
          git tag -l --format='%(contents)' "$env:GITHUB_REF" |
            Out-File -FilePath release-notes.md -Encoding utf8

      - name: Download self-contained MSI
        uses: actions/download-artifact@v4
        with:
          name: BlockRdpBruteForce-self-contained
          path: release-assets/self-contained

      - name: Download framework-dependent MSI
        uses: actions/download-artifact@v4
        with:
          name: BlockRdpBruteForce-framework-dependent
          path: release-assets/framework-dependent

      - name: Rename MSIs for release
        shell: pwsh
        run: |
          Rename-Item release-assets/self-contained/BlockRdpBruteForce.msi `
            BlockRdpBruteForce-${{ steps.version.outputs.version }}-self-contained.msi
          Rename-Item release-assets/framework-dependent/BlockRdpBruteForce.msi `
            BlockRdpBruteForce-${{ steps.version.outputs.version }}-framework-dependent.msi

      - name: Create GitHub release
        with:
          body_path: release-notes.md
          files: |
            release-assets/self-contained/BlockRdpBruteForce-${{ steps.version.outputs.version }}-self-contained.msi
            release-assets/framework-dependent/BlockRdpBruteForce-${{ steps.version.outputs.version }}-framework-dependent.msi
